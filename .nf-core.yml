lint:
  files_exist:
    - assets/multiqc_config.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-nfmicrofinder_logo_light.png
    - docs/images/nf-core-nfmicrofinder_logo_light.png
    - docs/images/nf-core-nfmicrofinder_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
  files_unchanged:
    - .github/CONTRIBUTING.md
    - assets/sendmail_template.txt
    - CODE_OF_CONDUCT.md
    - assets/nf-core-nfmicrofinder_logo_light.png
    - docs/images/nf-core-nfmicrofinder_logo_light.png
    - docs/images/nf-core-nfmicrofinder_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  multiqc_config: false
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
nf_core_version: 4.1.0
repository_type: pipeline
template:
  author: yumisims
  description: A pipeline to detect micro chromosome from bird genomes
  force: false
  is_nfcore: false
  name: nfmicrofinder
  org: sanger-tol
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - gpu
  version: 1.0.0
